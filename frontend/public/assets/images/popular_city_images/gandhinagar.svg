  <circle cx="82" cy="22" r="6" fill="#FFC800" opacity="0.95" />

  <!-- Base Line -->
  <line x1="5" y1="92" x2="95" y2="92" stroke="#6C38CC" stroke-width="2.5" stroke-linecap="round" />

  <!-- GIFT City Towers (Purple Outline Style) -->
  

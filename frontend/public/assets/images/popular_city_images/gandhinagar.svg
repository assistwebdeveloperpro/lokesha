  <line x1="32" y1="83" x2="46" y2="83" stroke="#6C38CC" stroke-width="1.5" />

  <!-- Skybridge Connection -->
  <rect x="46" y="50" width="8" height="6" fill="#EAE2FC" stroke="#6C38CC" stroke-width="2" />

  <!-- GIFT Two (Main Right Tower) -->
  <path d="M 54 92 L 54 15 L 68 20 L 68 92 Z" fill="#EAE2FC" stroke="#6C38CC" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Diagonal Facet Cutout Top -->
  <line x1="54" y1="28" x2="68" y2="20" stroke="#6C38CC" stroke-width="2" />
  <!-- Glass Window Grids -->
  <line x1="61" y1="24" x2="61" y2="92" stroke="#6C38CC" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="54" y1="40" x2="68" y2="40" stroke="#6C38CC" stroke-width="1.5" />
  <line x1="54" y1="55" x2="68" y2="55" stroke="#6C38CC" stroke-width="1.5" />
  <line x1="54" y1="70" x2="68" y2="70" stroke="#6C38CC" stroke-width="1.5" />
  <line x1="54" y1="83" x2="68" y2="83" stroke="#6C38CC" stroke-width="1.5" />

  <!-- Right Modern Building Accent -->

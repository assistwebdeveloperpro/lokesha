  <line x1="15" y1="85" x2="27" y2="85" stroke="#6C38CC" stroke-width="1.5" />

  <!-- GIFT One (Main Left Tower) -->
  <path d="M 32 92 L 32 20 L 46 15 L 46 92 Z" fill="#EAE2FC" stroke="#6C38CC" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Diagonal Facet Cutout Top -->
  <line x1="32" y1="20" x2="46" y2="28" stroke="#6C38CC" stroke-width="2" />
  <!-- Glass Window Grids -->
  <line x1="39" y1="24" x2="39" y2="92" stroke="#6C38CC" stroke-width="1.5" stroke-dasharray="3,3" />

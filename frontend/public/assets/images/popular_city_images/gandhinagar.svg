  <rect x="15" y="55" width="12" height="37" fill="none" stroke="#6C38CC" stroke-width="2" stroke-linejoin="round" />
  <line x1="15" y1="65" x2="27" y2="65" stroke="#6C38CC" stroke-width="1.5" />
